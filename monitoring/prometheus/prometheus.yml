global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'portfolio'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['portfolio:3000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']